# CI Pipeline — HUB by Raisen
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: TypeScript strict check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: "Gate: archivos <= 75 lineas"
        run: pnpm check:lines

      - name: "Gate: capas DDD + zero any"
        run: pnpm check:layers

      - name: Tests unitarios
        run: pnpm test:unit

      - name: Tests de integración
        run: pnpm test:integration
        continue-on-error: true

      - name: "Gate: emojis"
        run: pnpm check:emojis

      - name: "Gate: auth (Compuerta 17)"
        run: pnpm check:auth

      - name: "Compuerta #20 — Migrations drift"
        run: pnpm run check:migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: "Compuerta #21 — ESLint no-raw-login-redirect"
        run: pnpm run check:eslint-no-raw-login
        continue-on-error: true

      - name: "Gate: build pipeline"
        run: pnpm build

      - name: "Gate: server smoke"
        run: pnpm check:server-smoke

      - name: "Compuerta #21 — ESLint no-raw-login-redirect"
        run: pnpm run check:eslint-no-raw-login
        continue-on-error: true
