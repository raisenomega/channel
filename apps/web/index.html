<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1420" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="HUB by Raisen — Plataforma omnicanal con agente IA, CRM y autonomia" />
    <meta name="application-name" content="HUB by Raisen" />
    <!-- Config de runtime (publica, segura de exponer): Supabase URL + anon key -->
    <script>
      window.__HUB_CONFIG__ = {
        supabaseUrl: "https://qbpzdoopruqbnerdcyfq.supabase.co",
        anonKey: "sb_publishable_2L3-FfRoCdSyqyIwjVqbJQ_8uix05Ti"
      };
    </script>
    <!-- Rudimentario y a prueba de fallos: tema aplicado antes del primer render (evita flash).
         Delega los clicks de tema/idioma a nivel de documento para que funcionen siempre,
         independientemente del estado de montaje del bundle principal. -->
    <script>
      (function () {
        var TEMA = "hub.tema";
        var IDIOMA = "hub.idioma";
        function leer(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
        function aplicar() {
          var t = leer(TEMA, "dark");
          document.documentElement.setAttribute("data-theme", t);
        }
        aplicar();
        document.addEventListener("click", function (ev) {
          var el = ev.target && ev.target.closest ? ev.target.closest("[data-theme-toggle],[data-lang-toggle]") : null;
          if (!el) return;
          if (el.hasAttribute("data-theme-toggle")) {
            var nt = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", nt);
            try { localStorage.setItem(TEMA, nt); } catch (e) {}
            var p = document.querySelector("[data-theme-icon]");
            if (p) p.setAttribute("d", nt === "dark" ? "M21 12.8A8.5 8.5 0 1 1 11.2 3a6.5 6.5 0 0 0 9.8 9.8z" : "M11 1v2M11 19v2M1 11h2M19 11h2M3.5 3.5 5 5M17 17l1.5 1.5M3.5 18.5 5 17M17 5l1.5-1.5M11 7a4 4 0 1 0 0 8 4 4 0 0 0 0-8");
            window.dispatchEvent(new CustomEvent("hub:ui-changed"));
          } else {
            var ni = leer(IDIOMA, "es") === "en" ? "es" : "en";
            try { localStorage.setItem(IDIOMA, ni); } catch (e) {}
            var lb = document.querySelector("[data-lang-label]");
            if (lb) lb.textContent = ni.toUpperCase();
            window.dispatchEvent(new CustomEvent("hub:ui-changed"));
          }
        });
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />
    <!-- Sistema de estilos OMEGA: entrada unica que compone tailwind -> fonts -> tokens -> theme -> animations -> base -> components -->
    <link rel="stylesheet" href="/src/styles/index.css" />
    <!-- Identidad: castillo + escudo (FORTRESS. by Raisen), SVG inline, sin emojis -->
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <title>HUB · Raisen</title>
  </head>
  <body>
    <!-- Shell OMEGA: navegacion glass + area de vistas -->
    <div id="shell" class="glass">
      <nav id="nav" class="nav" aria-label="Navegacion principal">
        <div class="nav-brand" aria-label="HUB by Raisen">
          <span class="nav-mark" aria-hidden="true">HB</span>
          <span class="nav-name">HUB<small>by Raisen</small></span>
        </div>
        <div class="nav-links" role="tablist">
          <button class="nav-item tap" data-tab="inbox" role="tab" aria-selected="true">Inbox</button>
          <button class="nav-item tap" data-tab="agent" role="tab">IA</button>
          <button class="nav-item tap" data-tab="channels" role="tab">Canales</button>
          <button class="nav-item tap" data-tab="settings" role="tab">Ajustes</button>
        </div>
        <div class="nav-tools">
          <button class="nav-tool tap" data-lang-toggle aria-label="Cambiar idioma" title="Idioma">
            <span data-lang-label>ES</span>
          </button>
          <button class="nav-tool tap" data-theme-toggle aria-label="Cambiar tema" title="Tema">
            <svg viewBox="0 0 22 22" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path data-theme-icon d="M11 1v2M11 19v2M1 11h2M19 11h2M3.5 3.5 5 5M17 17l1.5 1.5M3.5 18.5 5 17M17 5l1.5-1.5M11 7a4 4 0 1 0 0 8 4 4 0 0 0 0-8" />
            </svg>
          </button>
        </div>
      </nav>
      <main id="app" class="app slide-up" aria-live="polite"></main>
    </div>
    <noscript>
      <p style="padding:1rem;color:inherit">HUB by Raisen requiere JavaScript.</p>
    </noscript>
    <!-- Bootstrap de la app (vanilla ESM). La app monta su estado en #app. -->
    <script type="module">
      import { inicializarHUB } from "/src/main.ts";
      inicializarHUB(document.getElementById("app"));
    </script>
  </body>
</html>
