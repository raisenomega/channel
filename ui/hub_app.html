<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0FB5A6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1B2A" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="application-name" content="HUB by Raisen">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --hub:#0FB5A6;--hub-deep:#0A8F84;--hub-light:#D1F7F2;
  --agent:#F5A623;--agent-deep:#C97C0C;--agent-light:#FFF3DC;
  --good:#1F9D55;--good-light:#E6F7EE;--warn:#E8833A;--danger:#E5484D;--danger-light:#FDECEC;
  --info:#2D6FE0;--info-light:#E7EFFC;
  --wa:#25D366;--ig:#E1306C;--ms:#0084FF;--em:#6E56CF;--sms:#F5A623;--tg:#29A9EB;--tw:#0E1B2A;--li:#0A66C2;--web:#0FB5A6;
  --ink:#0E1B2A;--ink2:#5B7186;--ink3:#93A3B4;
  --bg:#E7ECF1;--surface:#FFFFFF;--panel:#F3F6F9;--line:#E6ECF2;
  --shadow-sm:0 1px 3px rgba(14,27,42,.08);--shadow:0 4px 12px rgba(14,27,42,.12);--shadow-lg:0 18px 50px rgba(14,27,42,.28);
  --radius-sm:8px;--radius:12px;--radius-lg:16px;--radius-xl:24px;--radius-full:9999px;
  --fs-xs:11px;--fs-sm:12px;--fs-base:14px;--fs-lg:16px;--fs-xl:20px;--fs-2xl:24px;
  --space-xs:4px;--space-sm:8px;--space:12px;--space-lg:16px;--space-xl:24px;
  --font:'Sora',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root{--ink:#E8EDF2;--ink2:#9AAFC4;--ink3:#5B7186;--bg:#0E1B2A;--surface:#1A2D42;--panel:#14232F;--line:#2E4460;
    --shadow-sm:0 1px 3px rgba(0,0,0,.3);--shadow:0 4px 12px rgba(0,0,0,.4);--shadow-lg:0 18px 50px rgba(0,0,0,.5);}
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#F2F5F8,var(--bg));min-height:100vh;color:var(--ink);font-family:var(--font);font-size:var(--fs-base);overflow-x:hidden}
.app{display:flex;flex-direction:column;max-width:100%;min-height:100vh}
.app-main{flex:1;display:flex;flex-direction:column}
@media(min-width:768px){
  .app{flex-direction:row;height:100vh}.app-main{flex-direction:row;height:100vh}
  .panel-left{width:320px;max-width:35%;flex:0 0 auto;border-right:1px solid var(--line);overflow-y:auto}
  .panel-center{flex:1;overflow-y:auto}.panel-right{width:300px;max-width:30%;flex:0 0 auto;border-left:1px solid var(--line);overflow-y:auto}
  nav{display:none}
}
@media(max-width:767px){.panel-left,.panel-right{display:none}.panel-center{flex:1}}
.flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}.justify-between{justify-content:space-between}.gap-sm{gap:8px}.gap{gap:12px}.ml-auto{margin-left:auto}
.text-sm{font-size:var(--fs-sm)}.text-xs{font-size:var(--fs-xs)}.text-base{font-size:var(--fs-base)}.font-bold{font-weight:600}.text-muted{color:var(--ink2)}.text-dim{color:var(--ink3)}.text-hub{color:var(--hub)}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:var(--space-lg);box-shadow:var(--shadow-sm)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:var(--radius-full);font-size:var(--fs-xs);font-weight:600}
.badge-agent{background:var(--agent-light);color:var(--agent-deep)}.badge-good{background:var(--good-light);color:var(--good)}.badge-danger{background:var(--danger-light);color:var(--danger)}.badge-hub{background:var(--hub-light);color:var(--hub-deep)}
.btn{display:inline-flex;align-items:center;padding:10px 16px;border:none;border-radius:var(--radius);font-family:inherit;font-size:var(--fs-base);font-weight:600;cursor:pointer}
.btn-primary{background:var(--hub);color:#fff}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.list-item{display:flex;gap:var(--space);padding:var(--space) var(--space-lg);border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.list-item:last-child{border-bottom:none}.list-item .body{flex:1;min-width:0}
.list-item .h{display:flex;align-items:center;gap:var(--space-sm)}
.list-item .h .nm{font-size:var(--fs-base);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .h .tm{margin-left:auto;font-size:var(--fs-xs);color:var(--ink3)}
.list-item .msg{font-size:var(--fs-sm);color:var(--ink2);margin-top:2px;line-clamp:2}
.chips{display:flex;gap:var(--space-sm);overflow-x:auto;padding:2px;scrollbar-width:none;margin-bottom:var(--space)}
.chip{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;min-width:85px;cursor:pointer;white-space:nowrap}
.chip-name{font-size:var(--fs-sm);font-weight:600}.chip-status{font-size:10px;display:flex;align-items:center;gap:4px;color:var(--ink2);margin-top:5px}
.dot{width:6px;height:6px;border-radius:50%}.dot-on{background:var(--good)}.dot-off{background:var(--danger)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:var(--space)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:var(--space) var(--space-lg)}
.kpi-label{font-size:var(--fs-xs);color:var(--ink2)}.kpi-value{font-size:var(--fs-2xl);font-weight:700;margin-top:4px;display:flex;align-items:baseline;gap:3px;color:var(--ink);letter-spacing:-.3px}
.kpi-value small{font-size:var(--fs-sm);color:var(--ink3);font-weight:500}
.section{font-size:var(--fs-sm);font-weight:600;color:var(--ink2);margin:var(--space-lg) 0 var(--space-sm);display:flex;align-items:center}
.section .more{margin-left:auto;font-size:var(--fs-xs);color:var(--hub-deep);cursor:pointer}
.avatar{width:36px;height:36px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-weight:700;font-size:var(--fs-sm);color:#fff;position:relative}
.avatar .channel-badge{position:absolute;right:-4px;bottom:-4px;width:14px;height:14px;border-radius:3px;border:2px solid var(--surface);display:grid;place-items:center;font-size:6px;color:#fff;font-weight:700}
.switch{width:36px;height:20px;border-radius:999px;background:#C9D3DD;position:relative;cursor:pointer;flex:0 0 auto}.switch.on{background:var(--hub)}.switch i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}.switch.on i{left:auto;right:2px}
.kv{display:flex;justify-content:space-between;font-size:var(--fs-sm);padding:8px 0}.feat{display:flex;gap:var(--space-sm);padding:8px 0;font-size:var(--fs-sm);align-items:flex-start}
.brain{background:linear-gradient(150deg,#14232F,#0E1B2A 60%);border-radius:var(--radius-xl);padding:18px 17px;color:#fff;position:relative;overflow:hidden}
.agmetrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--space-sm);margin-top:14px}
.am{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius);padding:10px 8px;text-align:center}
.am b{font-size:var(--fs-lg);font-weight:700}.am small{font-size:9.5px;color:#9FB4C4;display:block;margin-top:3px}
.topbar{display:flex;align-items:center;gap:var(--space);padding:8px 16px}
.topbar .logo{width:36px;height:36px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--hub),var(--hub-deep));color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.3px}
.topbar h1{font-size:var(--fs-base);font-weight:600;margin:0;line-height:1.2}
.topbar p{margin:1px 0 0;font-size:var(--fs-xs);color:var(--ink2)}
.mode-pill{display:flex;align-items:center;gap:6px;background:var(--agent-light);border:1px solid #F3D89B;color:var(--agent-deep);padding:5px 10px;border-radius:var(--radius-full);font-size:10px;font-weight:600;cursor:pointer;white-space:nowrap;margin-left:auto}
.mode-pill .pulse-dot{width:6px;height:6px;border-radius:50%;background:var(--agent);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,166,35,.55)}70%{box-shadow:0 0 0 6px rgba(245,166,35,0)}100%{box-shadow:0 0 0 0 rgba(245,166,35,0)}}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + var(--safe-bottom));z-index:100}
nav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink3);font-family:inherit;font-size:9px;font-weight:500;cursor:pointer;padding:4px 0}
nav button svg{width:18px;height:18px}nav button.active{color:var(--hub)}
.view{animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar">
    <div class="logo">H</div>
    <div><h1 id="bizName">Restaurante Sabor Criollo</h1><p>San Juan, PR · HUB by Raisen</p></div>
    <button class="mode-pill" id="modeBtn" aria-label="Cambiar modo de operacion">
      <span class="pulse-dot"></span><span id="modeLabel">Ecosistema</span>
    </button>
  </header>
  <div class="app-main">
    <div class="panel-left" id="panelLeft"></div>
    <div class="panel-center" id="panelCenter"></div>
    <div class="panel-right" id="panelRight"></div>
  </div>
</div>
<nav id="bottomNav">
  <button data-tab="inbox" class="active"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 9l8 4v6h-8v-6H3zM5 8l6 4v6h-6v-6H5zM7 11l10 2v6h-10v-6H7z" fill="currentColor"/></svg>Inbox</button>
  <button data-tab="channels"><svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 6l12 0v12h-12v-12z" fill="currentColor"/><circle cx="8" cy="10" r="2" fill="currentColor"/></svg>Canales</button>
  <button data-tab="agent"><svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 6l4 4v6h-4v-4H10zM8 10l8 2v6h-8v-6H8z" fill="currentColor"/></svg>IA</button>
  <button data-tab="sales"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 16l6-6v-2h6v8H4zM14 10l6 2v6h-6v-2H14z" fill="currentColor"/><path d="M6 10l12 2v4h-12v-4H6z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Ventas</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="3" y1="3" x2="3" y2="21" stroke="currentColor" stroke-width="1.5"/><line x1="21" y1="3" x2="21" y2="21" stroke="currentColor" stroke-width="1.5"/></svg>Ajustes</button>
</nav>
<script>
const MODES=["Lite","Ecosistema","Autonomo"];let modeIdx=1,curTab="inbox";
const $id=s=>document.getElementById(s);
const icons={whatsapp:"<path d='M6 6l12 0v12h-12v-12z'/>",email:"<rect x='4' y='4' rx='3' width='16' height='12'/><path d='M6 6h12v-2h-12z'/>",instagram:"<circle cx='12' cy='10' r='8'/><path d='M8 18l8 0v-4h-8v4z'/>",webchat:"<rect x='4' y='4' rx='6' width='16' height='10'/><path d='M6 16l12 0v4h-12v-4z'/>",telegram:"<circle cx='12' cy='12' r='9'/><path d='M6 6l12 0v12h-12v-12z'/>",sms:"<rect x='6' y='4' rx='4' width='12' height='16'/>",x:"<circle cx='12' cy='12' r='9'/><line x1='3' y1='3' x2='21' y2='21' stroke='currentColor' stroke-width='1.5'/>",linkedin:"<rect x='4' y='4' rx='4' width='16' height='16'/><path d='M6 6h12z'/>"};
const lucide=(n,s=16)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="currentColor">${icons[n]||icons.whatsapp}</svg>`;
function goTab(t){curTab=t;document.querySelectorAll("#bottomNav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));render()}
function cycleMode(){modeIdx=(modeIdx+1)%MODES.length;$id("modeLabel").textContent=MODES[modeIdx];render()}
function render(){
  const ch=["whatsapp","email","instagram","facebook","telegram","sms","x","linkedin","webchat"];
  const convos=[
    {ch:"web",nm:"Visitante web #A19",tm:"ahora",msg:"A que hora cierran hoy?",by:"agent",co:98,sl:false},
    {ch:"ig",nm:"Genesis Fontanez",tm:"3:05",msg:"Tienen opciones sin gluten?",by:"human",co:41,sl:false},
    {ch:"wa",nm:"Luis Rodriguez",tm:"3:18",msg:"Perfecto! Orden confirmada. Total $24.",by:"agent",co:94,sl:false},
    {ch:"em",nm:"Caribe Foods",tm:"1:22",msg:"Adjunto cotizacion actualizada.",by:"human",co:null,sl:true},
    {ch:"tw",nm:"@josuecomer",tm:"12:47",msg:"Hacen delivery a Bayamon?",by:"human",co:null,sl:false}
  ];
  const chips=ch.map(c=>`<div class="chip flex items-center gap-sm">${lucide(c,14)}<span class="chip-name">${c}</span></div>`).join("");
  const list=convos.map(c=>`<div class="list-item flex items-center gap px-lg py-sm"><div class="avatar" style="background:var(--hub-deep)">${c.nm[0]}<span class="channel-badge" style="background:var(--hub)">${lucide(c.ch,10)}</span></div><div class="body"><div class="h"><span class="nm truncate">${c.nm}</span>${c.sl?`<span class="badge badge-danger text-xs">SLA</span>`:""}<span class="tm text-xs text-dim ml-auto">${c.tm}</span></div><div class="msg line-clamp-2">${c.msg}</div></div></div>`).join("");
  const pages={
    inbox:`<div class="view"><div class="kpis"><div class="kpi"><div class="kpi-label">Conversaciones</div><div class="kpi-value">23<small>hoy</small></div></div><div class="kpi"><div class="kpi-label">IA Was Correct</div><div class="kpi-value" style="color:var(--good)">94<small>%</small></div></div><div class="kpi"><div class="kpi-label">Ventas desde chat</div><div class="kpi-value" style="color:var(--hub)">$589<small>hoy</small></div></div><div class="kpi"><div class="kpi-label">Autonomia</div><div class="kpi-value">87<small>%</small></div></div></div><div class="section">Canales <span class="more text-xs text-hub">Ver todos</span></div><div class="chips">${chips}</div><div class="section">Conversaciones activas <span class="more text-xs text-hub">Ver todas</span></div><div class="list">${list}</div></div>`,
    channels:`<div class="view"><div class="section">Canales conectados <span class="more text-xs text-hub">9 canales</span></div><div class="chips">${chips}</div><div class="list">${ch.map(c=>`<div class="list-item flex items-center gap px-lg py-sm"><div class="avatar-sm">${lucide(c,14)}</div><div class="body"><div class="h"><span class="nm truncate">${c}</span></div></div><div class="switch on"><i></i></div></div>`).join("")}</div><div class="section">Configurar proveedor IA</div><div class="card" style="padding:14px"><div class="kv"><span class="text-muted">Proveedor</span><span class="text-hub font-bold">Anthropic Claude</span></div><div class="kv"><span class="text-muted">Modelo</span><span class="text-hub" style="font-family:monospace">claude-sonnet-4-6</span></div><div class="kv"><span class="text-muted">DeepSeek (BYOK)</span><span class="text-hub text-sm" style="color:var(--hub-deep)">Key configurada</span></div><div class="kv"><span class="text-muted">Qwen (BYOK)</span><span class="text-hub text-sm" style="color:var(--hub-deep)">No configurado</span></div></div></div>`,
    agent:`<div class="view"><div class="brain"><div class="flex items-center gap-sm"><div style="width:32px;height:32px;border-radius:10px;background:rgba(245,166,35,.16);border:1px solid rgba(245,166,35,.4);display:grid;place-items:center;color:var(--agent);font-size:16px">${lucide("email",22)}</div><h3 style="margin:0;font-size:14px;font-weight:600">Agente IA ${MODES[modeIdx]}<span style="display:block;font-size:11px;color:#9FB4C4;font-weight:400;margin-top:2px">Proveedor: Anthropic Claude · Modelo: claude-sonnet-4-6</span></h3></div><div class="agmetrics"><div class="am"><b>94%</b><small>Was Correct</small></div><div class="am"><b>92%</b><small>Indistinguibilidad</small></div><div class="am"><b>87%</b><small>Resol. autonomia</small></div></div></div><div class="section">Metricas de calidad IA</div><div class="kpis"><div class="kpi"><div class="kpi-label">Was Correct</div><div class="kpi-value" style="color:var(--good)">94<small>%</small></div></div><div class="kpi"><div class="kpi-label">Indistinguibilidad</div><div class="kpi-value" style="color:var(--hub)">92<small>%</small></div></div><div class="kpi"><div class="kpi-label">Resol. autonoma</div><div class="kpi-value">87<small>%</small></div></div><div class="kpi"><div class="kpi-label">Latencia media</div><div class="kpi-value">1.45s</div></div></div><div class="section">Configuracion del proveedor IA</div><div class="card" style="padding:14px"><div class="kv"><span class="text-muted">Proveedor activo</span><span class="text-hub font-bold">Anthropic Claude</span></div><div class="kv"><span class="text-muted">BYOK</span><span class="text-hub" style="color:var(--hub-deep)">Usando key del tenant</span></div><div class="kv"><span class="text-muted">Fallback</span><span class="text-hub" style="color:var(--hub-deep)">DeepSeek</span></div></div><div class="section">Autonomia</div><div class="card" style="padding:12px"><div class="feat"><div class="switch on"><i></i></div><span>Fuera de horario laboral</span></div><div class="feat"><div class="switch on"><i></i></div><span>Consultas frecuentes en horario</span></div><div class="feat"><div class="switch off"><i></i></div><span>Cotizaciones y ordenes</span></div></div><div class="section">Siempre escala a humano</div><div class="list"><div class="row px-lg py-sm flex items-center gap"><span class="text-sm">Queja detectada</span></div><div class="row px-lg py-sm flex items-center gap"><span class="text-sm">Cliente VIP</span></div><div class="row px-lg py-sm flex items-center gap"><span class="text-sm">Monto mayor a umbral</span></div><div class="row px-lg py-sm flex items-center gap"><span class="text-sm">Solicitud legal</span></div><div class="row px-lg py-sm flex items-center gap"><span class="text-sm">El cliente pide hablar con una persona</span></div></div></div>`,
    settings:`<div class="view"><div class="section">Integraciones del ecosistema</div><div class="list"><div class="row px-lg py-sm flex items-center gap"><span class="font-bold">NUCLEO</span><span class="text-xs text-muted ml-auto">ERP · CRM · facturacion</span><span class="badge badge-good">Activo</span></div><div class="row px-lg py-sm flex items-center gap"><span class="font-bold">OMEGA</span><span class="text-xs text-muted ml-auto">Brand Voice</span><span class="badge badge-good">Activo</span></div><div class="row px-lg py-sm flex items-center gap"><span class="font-bold">POS</span><span class="text-xs text-muted ml-auto">Recibos digitales</span><span class="badge badge-good">Activo</span></div><div class="row px-lg py-sm flex items-center gap"><span class="font-bold">TABLE</span><span class="text-xs text-muted ml-auto">Reservas</span><span class="badge badge-good">Activo</span></div><div class="row px-lg py-sm flex items-center gap"><span class="font-bold">SAFE</span><span class="text-xs text-muted ml-auto">Auditoria continua</span><span class="badge badge-good">Activo</span></div></div><div class="section">Preferencias</div><div class="card" style="padding:14px"><div class="feat"><span class="font-bold">Idioma</span><span class="text-hub ml-auto">Espanol</span></div><div class="feat" style="margin-top:8px"><span class="font-bold">Tema</span><div class="switch off ml-auto"><i></i></div></div></div></div>`
  };
  $id("panelCenter").innerHTML=pages[curTab]||pages.inbox;
}
$id("modeBtn").onclick=cycleMode;
render();
</script>
</body>
</html>
